<fieldset class="contributor-row">
  <legend>Contributor {{ number }}</legend>
  <div class="field-row">
    <div class="field">
      <label for="contributor-{{ number }}-name">First names, surname</label>
      <input type="text" id="contributor-{{ number }}-name" name="{{ field.html_name }}-name" value="{{ name }}" maxlength="200" placeholder="Josiah Stinkney, Carberry" autocomplete="off" data-part="name">
    </div>
    <div class="field">
      <label for="contributor-{{ number }}-orcid">ORCID iD <span>(optional)</span></label>
      <input type="text" id="contributor-{{ number }}-orcid" name="{{ field.html_name }}-orcid" value="{{ orcid|cut:'https://orcid.org/' }}" maxlength="37" placeholder="0000-0002-1825-0097" autocomplete="off" spellcheck="false" data-part="orcid">
    </div>
    <div class="field">
      <label for="contributor-{{ number }}-email">Institutional email</label>
      <input type="email" id="contributor-{{ number }}-email" name="{{ field.html_name }}-email" value="{{ email }}" maxlength="254" placeholder="name@university.edu" autocomplete="off" spellcheck="false" data-part="email">
    </div>
  </div>
  {% if form.connected_orcid %}
    <label class="checkbox-field"><input type="checkbox" name="{{ field.html_name }}-own-orcid" value="{{ number }}" data-own-orcid="{{ form.connected_orcid.url }}"{% if own_orcid or orcid_proof %} checked{% endif %}><span>This is my contributor row. Use my connected ORCID: {{ form.connected_orcid.url|cut:'https://orcid.org/' }}.</span></label>
  {% endif %}
  <button type="button" class="text-button" aria-label="Remove contributor {{ number }}" data-remove-contributor hidden>Remove</button>
</fieldset>
