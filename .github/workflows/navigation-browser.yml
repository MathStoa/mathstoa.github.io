name: Check navigation in Chromium
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  navigation:
    # Keep the runner on the Ubuntu release supported by pinned Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt playwright==1.60.0
      - run: python -m playwright install --with-deps chromium
      - run: python server/manage.py collectstatic --noinput --settings=config.test_settings
      - run: python server/manage.py test accounts.test_navigation_browser submissions.test_revision_review_browser --settings=config.test_settings -v 2
        env:
          MATHSTOA_BROWSER_TESTS: '1'
