name: Check archive and account service
on:
  push:
  pull_request:
  schedule:
    # Weekly audit of pinned dependencies for newly published advisories.
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.12'
            database: postgresql://mathstoa:ci-only@localhost:5432/mathstoa
          - python: '3.13'
            database: ''
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mathstoa
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: mathstoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathstoa -d mathstoa"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python server/manage.py collectstatic --noinput --settings=config.test_settings
      - run: python server/manage.py makemigrations --check --dry-run --settings=config.test_settings
      - run: python server/manage.py test accounts submissions repository_verification --settings=config.test_settings -v 2
        env:
          MATHSTOA_TEST_DATABASE_URL: ${{ matrix.database }}
  browser-math:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r browser_tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s browser_tests -v
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python scripts/audit_vendor.py --online
      - run: python -m pip_audit -r server/requirements.txt --progress-spinner off --strict
