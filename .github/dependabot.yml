version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Stay on the Django 5.2 LTS until the move to the next LTS is planned.
      - dependency-name: django
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
