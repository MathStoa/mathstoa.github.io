name: Submit a mathematical project
description: Propose a public project for a reviewed mathStoa listing.
title: "[Project] "
body:
  - type: markdown
    attributes:
      value: |
        Your repository should contain meaningful mathematical work and ideally a DOI for an archived release ([how to get a DOI for a GitHub repository](https://docs.github.com/en/repositories/archiving-a-github-repository/referencing-and-citing-content#issuing-a-persistent-identifier-for-your-repository-with-zenodo)). A public website explaining the project’s aims is optional.
        Please read [CONTRIBUTING.md](https://github.com/MathStoa/mathstoa.github.io/blob/main/CONTRIBUTING.md). This issue and its review are public; do not include private contact details or correspondence. Submission does not publish a listing automatically.
  - type: input
    id: project-title
    attributes:
      label: Project title
    validations:
      required: true
  - type: input
    id: repository-url
    attributes:
      label: Public repository URL
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: input
    id: doi
    attributes:
      label: DOI (optional)
      description: If you have one, the DOI of an archived release of the repository. [How to get a DOI for a GitHub repository](https://docs.github.com/en/repositories/archiving-a-github-repository/referencing-and-citing-content#issuing-a-persistent-identifier-for-your-repository-with-zenodo).
      placeholder: 10.5281/zenodo.1234567
    validations:
      required: false
  - type: input
    id: reading-url
    attributes:
      label: Project website (optional)
      description: A publicly accessible website explaining the project’s aims and introducing the material in the repository.
      placeholder: https://example.org/project/
  - type: textarea
    id: abstract
    attributes:
      label: Short abstract
      description: 80–1,500 characters. Describe the research question or purpose, existing material, current status, and potential contributions. Plain text is welcome.
    validations:
      required: true
  - type: dropdown
    id: subjects
    attributes:
      label: Main subject
      description: Choose the closest subject. If none fits, choose General mathematics and describe the subject in the abstract.
      options:
        - math.AG — Algebraic geometry
        - math.AP — Analysis of PDEs
        - math.AT — Algebraic topology
        - math.CO — Combinatorics
        - math.DG — Differential geometry
        - math.DS — Dynamical systems
        - math.FA — Functional analysis
        - math.LO — Logic and foundations
        - math.NT — Number theory
        - math.PR — Probability
        - cs.LO — Lean formalisation
        - math.GM — General mathematics
    validations:
      required: true
  - type: textarea
    id: collaborators
    attributes:
      label: Contributors
      description: One contributor per line, including yourself. Give the name and surname, then their ORCID iD. Anyone can [register for an ORCID iD](https://orcid.org/register) free of charge.
      placeholder: Josiah Carberry, 0000-0002-1825-0097
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: I maintain this project or have permission to submit it, and have read the submission guidelines.
          required: true
        - label: I have the right to contribute the original summary under CC BY 4.0. Linked project material retains its existing rights and licenses.
          required: true
        - label: I understand that acceptance is an archive review, not mathematical peer review or an endorsement of correctness.
          required: true
