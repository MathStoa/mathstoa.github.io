name: Submit a mathematical project
description: Propose a public project for a reviewed MathStoa listing.
title: "[Project] "
body:
  - type: markdown
    attributes:
      value: |
        Your repository should contain meaningful mathematical work and link to a public website explaining the project’s aims.
        Please read [CONTRIBUTING.md](https://github.com/MathStoa/mathstoa.github.io/blob/main/CONTRIBUTING.md). This issue and its review are public; do not include private contact details or correspondence. Submission does not publish a listing automatically.
  - type: input
    id: project-title
    attributes:
      label: Project title
    validations:
      required: true
  - type: input
    id: repository-url
    attributes:
      label: Public repository URL
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: input
    id: reading-url
    attributes:
      label: Project website
      description: A publicly accessible website explaining the project’s aims and introducing the material in the repository.
      placeholder: https://example.org/project/
    validations:
      required: true
  - type: textarea
    id: abstract
    attributes:
      label: Original abstract
      description: In roughly 80–200 words, explain the question or purpose, existing content, and current state. Write for a mathematician outside your immediate specialty.
    validations:
      required: true
  - type: input
    id: subjects
    attributes:
      label: Subject categories
      description: Give the closest arXiv subject codes and any useful keywords, or describe a subject that does not fit.
      placeholder: math.AG, math.NT — arithmetic geometry
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Project kind
      options:
        - Research
        - Exposition
        - Formalization
        - Mixed
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Current stage
      description: This describes the project; it is not a correctness certification.
      options:
        - Exploration
        - Partial results
        - Claimed solution
        - Ongoing
        - Reference
        - Archived
    validations:
      required: true
  - type: dropdown
    id: collaboration
    attributes:
      label: Contribution preferences
      options:
        - Open to contributions
        - Specific help wanted
        - Currently closed
        - See repository
    validations:
      required: true
  - type: textarea
    id: help-wanted
    attributes:
      label: Useful contributions and contribution policy
      description: Link to the project's contribution and credit policy. If welcoming help, give concrete entry points and any expected background. Explain any limits on participation.
    validations:
      required: true
  - type: input
    id: steward
    attributes:
      label: Project steward
      description: Name or public handle and a public profile URL. Do not supply a private email address.
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Your permission to register the project
      description: For an unaffiliated suggestion, open a general issue instead and say that you do not represent the project.
      options:
        - I am a project steward or maintainer
        - I have a project steward's permission
    validations:
      required: true
  - type: textarea
    id: attribution
    attributes:
      label: Attribution and citation
      description: State the people or groups to credit, link to the project's citation or authorship information, and give the attribution to retain for your original summary. Mention section-level attribution if relevant.
    validations:
      required: true
  - type: textarea
    id: licenses
    attributes:
      label: Project reuse terms
      description: Link to the applicable licenses or rights statement. Distinguish prose, code, and other material if their terms differ. Public visibility alone does not grant reuse permission.
    validations:
      required: true
  - type: input
    id: snapshot
    attributes:
      label: Optional version or archive URL
      description: A release, commit, or archived version such as a DOI. A live branch is not an immutable snapshot.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: The named steward agrees to this public registration, and the project details and contribution preferences are accurate to the best of my knowledge.
          required: true
        - label: I have the right to contribute the original summary under CC BY 4.0, with the attribution supplied above. Linked project material retains its existing rights and licenses.
          required: true
        - label: I understand that acceptance is an archive review, not mathematical peer review or an endorsement of correctness.
          required: true
